<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FAQ Chatbot Widget</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 180px; box-sizing: border-box; font-family: inherit; padding: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; margin-top: 8px; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  #chat { margin-top: 16px; }
  .msg { margin: 8px 0; padding: 10px; border-radius: 6px; }
  .user { background: #e6f0ff; text-align: right; }
  .bot { background: #f5f5f5; }
</style>
</head>
<body>
  <h1>FAQ Chatbot Widget</h1>
  <p>Paste a business's FAQ/knowledge base once below, then ask questions as a customer would. The bot only answers from this text.</p>
  <label><strong>FAQ / knowledge base</strong></label>
  <textarea id="faq" placeholder="Q: What are your hours?&#10;A: We're open 9am-6pm Mon-Sat.&#10;&#10;Q: Do you offer refunds?&#10;A: Yes, within 30 days with a receipt."></textarea>

  <div id="chat"></div>
  <input type="text" id="question" placeholder="Ask a question as a customer..." />
  <button id="ask">Ask</button>
  <p id="status"></p>

<script>
  const chat = document.getElementById("chat");
  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
  }

  document.getElementById("ask").addEventListener("click", async () => {
    const faq = document.getElementById("faq").value.trim();
    const questionInput = document.getElementById("question");
    const question = questionInput.value.trim();
    const status = document.getElementById("status");
    if (!faq) {
      status.textContent = "Please paste the FAQ text first.";
      return;
    }
    if (!question) {
      status.textContent = "Please type a question.";
      return;
    }
    addMessage(question, "user");
    questionInput.value = "";
    status.textContent = "Thinking...";
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ faq, question }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      status.textContent = "";
      addMessage(data.result, "bot");
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  });

  document.getElementById("question").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("ask").click();
  });
</script>
</body>
</html>

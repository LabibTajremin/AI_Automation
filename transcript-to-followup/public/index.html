<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Transcript to Follow-up Email</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 280px; box-sizing: border-box; font-family: inherit; padding: 8px; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Transcript to Follow-up Email</h1>
  <p>Paste a call/meeting transcript (e.g. from Zoom, Google Meet) and get a drafted follow-up email.</p>
  <textarea id="transcript" placeholder="Paste transcript here..."></textarea>
  <button id="run">Generate Email</button>
  <p id="status"></p>
  <pre id="result"></pre>

<script>
  document.getElementById("run").addEventListener("click", async () => {
    const transcript = document.getElementById("transcript").value.trim();
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    result.textContent = "";
    if (!transcript) {
      status.textContent = "Please paste a transcript.";
      return;
    }
    status.textContent = "Generating...";
    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ transcript }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      status.textContent = "";
      result.textContent = data.result;
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  });
</script>
</body>
</html>

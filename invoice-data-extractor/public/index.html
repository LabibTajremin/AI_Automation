<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Invoice Data Extractor</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 280px; box-sizing: border-box; font-family: inherit; padding: 8px; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Invoice Data Extractor</h1>
  <p>Paste raw invoice text (copied from a PDF or email) to get structured JSON: vendor, line items, totals, etc.</p>
  <textarea id="invoiceText" placeholder="Paste invoice text here..."></textarea>
  <button id="run">Extract</button>
  <p id="status"></p>
  <pre id="result"></pre>

<script>
  document.getElementById("run").addEventListener("click", async () => {
    const invoiceText = document.getElementById("invoiceText").value.trim();
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    result.textContent = "";
    if (!invoiceText) {
      status.textContent = "Please paste invoice text.";
      return;
    }
    status.textContent = "Extracting...";
    try {
      const res = await fetch("/api/extract", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ invoiceText }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      status.textContent = data.warning || "";
      result.textContent = typeof data.result === "string" ? data.result : JSON.stringify(data.result, null, 2);
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Resume ATS Optimizer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 220px; box-sizing: border-box; font-family: inherit; padding: 8px; }
  button { margin-top: 12px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { font-weight: 600; }
</style>
</head>
<body>
  <h1>Resume ATS Optimizer</h1>
  <p>Paste your resume and a target job description to get a match score, missing keywords, and rewrite suggestions.</p>
  <div class="row">
    <div>
      <label>Resume</label>
      <textarea id="resume" placeholder="Paste resume text here..."></textarea>
    </div>
    <div>
      <label>Job description</label>
      <textarea id="jobDescription" placeholder="Paste job description here..."></textarea>
    </div>
  </div>
  <button id="run">Analyze</button>
  <p id="status"></p>
  <pre id="result"></pre>

<script>
  document.getElementById("run").addEventListener("click", async () => {
    const resume = document.getElementById("resume").value.trim();
    const jobDescription = document.getElementById("jobDescription").value.trim();
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    result.textContent = "";
    if (!resume || !jobDescription) {
      status.textContent = "Please fill in both fields.";
      return;
    }
    status.textContent = "Analyzing...";
    try {
      const res = await fetch("/api/optimize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ resume, jobDescription }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      status.textContent = "";
      result.textContent = data.result;
    } catch (err) {
      status.textContent = "Error: " + err.message;
    }
  });
</script>
</body>
</html>
